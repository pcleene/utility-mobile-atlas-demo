# Convenience compose for local dev. The app needs a real Atlas cluster
# (vector + sharding aren't supported on local mongod), so this file
# only spins up the API + the SvelteKit dev server. The Atlas connection
# string is expected in `backend/.env`.
services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: bash -lc "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api
